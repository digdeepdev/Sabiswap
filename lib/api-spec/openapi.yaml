openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sideshift
    description: SideShift.ai swap operations
paths:
  /affiliate/activity:
    get:
      operationId: getAffiliateActivity
      tags: [sideshift]
      responses:
        "200":
          description: Completed swaps attributed to the configured affiliate account, never platform-wide activity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AffiliateActivity" }
        "503":
          description: Affiliate reporting is temporarily unavailable
  /campaign:
    get:
      operationId: getCampaign
      tags: [campaign]
      responses:
        "200":
          description: Public verified campaign progress and leaderboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campaign" }
  /campaign/entries:
    post:
      operationId: submitCampaignEntry
      tags: [campaign]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignEntryInput" }
      responses:
        "201":
          description: Saved for manual review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignEntryReceipt" }
  /campaign/entries/mine:
    get:
      operationId: getMyCampaignEntries
      tags: [campaign]
      responses:
        "200":
          description: Entries belonging to this browser
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CampaignEntryReceipt" }
  /campaign/admin/session:
    get:
      operationId: getCampaignAdminSession
      tags: [campaign]
      responses:
        "200":
          description: Admin session state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignAdminSession" }
  /campaign/admin/login:
    post:
      operationId: loginCampaignAdmin
      tags: [campaign]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignAdminCredentials" }
      responses:
        "200":
          description: HTTP-only session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignAdminSession" }
  /campaign/admin/logout:
    post:
      operationId: logoutCampaignAdmin
      tags: [campaign]
      responses:
        "200":
          description: Session cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignAdminSession" }
  /campaign/admin/entries:
    get:
      operationId: getCampaignAdminEntries
      tags: [campaign]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected], default: pending }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Protected paginated review queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignAdminQueue" }
  /campaign/admin/entries/{id}/check:
    post:
      operationId: checkCampaignOrder
      tags: [campaign]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Live provider status; USD valuation requires manual reconciliation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignOrderCheck" }
  /campaign/admin/entries/{id}/review:
    post:
      operationId: reviewCampaignEntry
      tags: [campaign]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignReviewInput" }
      responses:
        "200":
          description: Review saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignAdminEntry" }
  /campaign/admin/settings:
    get:
      operationId: getCampaignSettings
      tags: [campaign]
      responses:
        "200":
          description: Protected fee reconciliation and prize tiers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignSettings" }
    put:
      operationId: updateCampaignSettings
      tags: [campaign]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignSettingsInput" }
      responses:
        "200":
          description: Settings saved with audit record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CampaignSettings" }
  /market/prices:
    get:
      operationId: getMarketPrices
      tags: [market]
      summary: Top cryptocurrencies by market capitalization
      responses:
        "200":
          description: USD prices, 24-hour changes and seven-day price history from CoinGecko
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPrices"
        "502":
          description: Market data temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sideshift/coins:
    get:
      operationId: listSideShiftCoins
      tags: [sideshift]
      summary: List supported SideShift coins
      responses:
        "200":
          description: Supported coins and networks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SideShiftCoin"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /sideshift/quote:
    post:
      operationId: createSideShiftQuote
      tags: [sideshift]
      summary: Create a SideShift quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SideShiftQuoteInput"
      responses:
        "200":
          description: Quote details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SideShiftQuote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /sideshift/shifts/fixed:
    post:
      operationId: createSideShiftFixedShift
      tags: [sideshift]
      summary: Create a fixed-rate SideShift shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SideShiftFixedShiftInput"
      responses:
        "201":
          description: Fixed shift details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SideShiftShift"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /sideshift/shifts/{shiftId}:
    get:
      operationId: getSideShiftShift
      tags: [sideshift]
      summary: Get SideShift shift status
      parameters:
        - name: shiftId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shift details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SideShiftShift"
        "404":
          description: Shift not found
        "502":
          $ref: "#/components/responses/UpstreamError"
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamError:
      description: SideShift.ai API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AffiliateTransaction:
      type: object
      required: [completedAt, depositCoin, depositNetwork, depositAmount, settleCoin, settleNetwork, settleAmount, volumeUsd]
      properties:
        completedAt: { type: string, format: date-time }
        depositCoin: { type: string }
        depositNetwork: { type: string }
        depositAmount: { type: ["string", "null"] }
        settleCoin: { type: string }
        settleNetwork: { type: string }
        settleAmount: { type: ["string", "null"] }
        volumeUsd: { type: ["number", "null"] }
    AffiliateActivity:
      type: object
      required: [totalVolumeUsd, completedTransactions, recentTransactions, updatedAt, stale]
      properties:
        totalVolumeUsd:
          type: ["number", "null"]
          description: Sum of provider-reported USD values for all completed affiliate swaps. Null if any historical USD value is missing.
        completedTransactions: { type: integer, minimum: 0 }
        recentTransactions:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/AffiliateTransaction" }
        updatedAt: { type: string, format: date-time }
        stale: { type: boolean }
    CampaignTier:
      type: object
      required: [rankStart, rankEnd, sharePercent]
      properties:
        rankStart: { type: integer, minimum: 1, maximum: 100 }
        rankEnd: { type: integer, minimum: 1, maximum: 100 }
        sharePercent: { type: number, exclusiveMinimum: 0, maximum: 100 }
    CampaignLeader:
      type: object
      required: [rank, twitterUsername, volumeUsd, orders]
      properties:
        rank: { type: integer }
        twitterUsername: { type: string }
        volumeUsd: { type: number }
        orders: { type: integer }
    Campaign:
      type: object
      required: [name, startsAt, endsAt, phase, targetVolumeUsd, minimumSwapUsd, verifiedVolumeUsd, progressPercent, approvedOrders, participants, earnedFeesUsd, communityRewardsUsd, feesUpdatedAt, rewardSharePercent, twitterUrl, telegramUrl, prizeTiers, leaderboard]
      properties:
        name: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        phase: { type: string, enum: [upcoming, active, ended] }
        targetVolumeUsd: { type: number }
        minimumSwapUsd: { type: number }
        verifiedVolumeUsd: { type: number }
        progressPercent: { type: number }
        approvedOrders: { type: integer }
        participants: { type: integer }
        earnedFeesUsd: { type: [number, "null"] }
        communityRewardsUsd: { type: [number, "null"] }
        feesUpdatedAt: { type: [string, "null"], format: date-time }
        rewardSharePercent: { type: number }
        twitterUrl: { type: string }
        telegramUrl: { type: string }
        prizeTiers:
          type: array
          items: { $ref: "#/components/schemas/CampaignTier" }
        leaderboard:
          type: array
          items: { $ref: "#/components/schemas/CampaignLeader" }
    CampaignEntryInput:
      type: object
      required: [orderId, twitterUsername, followsTwitter, joinedTelegram, consent]
      properties:
        orderId: { type: string, minLength: 8, maxLength: 100 }
        twitterUsername: { type: string, minLength: 1, maxLength: 16 }
        followsTwitter: { type: boolean }
        joinedTelegram: { type: boolean }
        consent: { type: boolean }
    CampaignEntryReceipt:
      type: object
      required: [id, twitterUsername, status, volumeUsd, submittedAt]
      properties:
        id: { type: integer }
        twitterUsername: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        volumeUsd: { type: [number, "null"] }
        submittedAt: { type: string, format: date-time }
    CampaignAdminSession:
      type: object
      required: [authenticated, configured]
      properties:
        authenticated: { type: boolean }
        configured: { type: boolean }
    CampaignAdminCredentials:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 256 }
    CampaignAdminEntry:
      allOf:
        - $ref: "#/components/schemas/CampaignEntryReceipt"
        - type: object
          required: [orderId, reviewNote, evidence, reviewedAt]
          properties:
            orderId: { type: string }
            reviewNote: { type: [string, "null"] }
            evidence: { type: [string, "null"] }
            reviewedAt: { type: [string, "null"], format: date-time }
    CampaignAdminQueue:
      type: object
      required: [entries, total]
      properties:
        total: { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/CampaignAdminEntry" }
    CampaignOrderCheck:
      type: object
      required: [providerStatus, createdAt, completedAt, eligibleWindow, depositCoin, depositAmount, settleCoin]
      properties:
        providerStatus: { type: string }
        createdAt: { type: string }
        completedAt: { type: [string, "null"] }
        eligibleWindow: { type: boolean }
        depositCoin: { type: string }
        depositAmount: { type: string }
        settleCoin: { type: string }
    CampaignReviewInput:
      type: object
      required: [decision, volumeUsd, evidence, reviewNote, verifiedTwitter, verifiedTelegram, verifiedOwnership]
      properties:
        decision: { type: string, enum: [approved, rejected, pending] }
        volumeUsd: { type: string, maxLength: 30 }
        evidence: { type: string, maxLength: 500 }
        reviewNote: { type: string, maxLength: 500 }
        verifiedTwitter: { type: boolean }
        verifiedTelegram: { type: boolean }
        verifiedOwnership: { type: boolean }
    CampaignSettingsInput:
      type: object
      required: [earnedFeesUsd, evidence, prizeTiers]
      properties:
        earnedFeesUsd: { type: [string, "null"], maxLength: 30 }
        evidence: { type: string, maxLength: 500 }
        prizeTiers:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/CampaignTier" }
    CampaignSettings:
      type: object
      required: [earnedFeesUsd, evidence, prizeTiers, updatedAt]
      properties:
        earnedFeesUsd: { type: [number, "null"] }
        evidence: { type: string }
        prizeTiers:
          type: array
          items: { $ref: "#/components/schemas/CampaignTier" }
        updatedAt: { type: [string, "null"], format: date-time }
    MarketPrices:
      type: object
      required: [coins, fetchedAt, source, stale]
      properties:
        coins:
          type: array
          items:
            $ref: "#/components/schemas/MarketCoin"
        fetchedAt:
          type: string
        source:
          type: string
        stale:
          type: boolean
    MarketCoin:
      type: object
      required: [id, symbol, name, image, priceUsd, change24h, rank, sparkline, lastUpdated]
      properties:
        id:
          type: string
        symbol:
          type: string
        name:
          type: string
        image:
          type: string
        priceUsd:
          type: number
        change24h:
          type: ["number", "null"]
        rank:
          type: ["number", "null"]
        sparkline:
          type: array
          items:
            type: number
        lastUpdated:
          type: ["string", "null"]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: ["string", "null"]
      required:
        - error
    SideShiftCoin:
      type: object
      properties:
        coin:
          type: string
        name:
          type: string
        networks:
          type: array
          items:
            type: string
        networksWithMemo:
          type: array
          items:
            type: string
        fixedOnly:
          oneOf:
            - type: boolean
            - type: array
              items:
                type: string
        variableOnly:
          oneOf:
            - type: boolean
            - type: array
              items:
                type: string
        tokenDetails:
          type: object
          additionalProperties:
            type: object
            properties:
              contractAddress:
                type: string
              decimals:
                type: number
            required: [contractAddress, decimals]
      required: [coin, name, networks, networksWithMemo, fixedOnly, variableOnly]
    SideShiftQuoteInput:
      type: object
      properties:
        depositCoin:
          type: string
          minLength: 1
        depositNetwork:
          type: string
          minLength: 1
        settleCoin:
          type: string
          minLength: 1
        settleNetwork:
          type: string
          minLength: 1
        depositAmount:
          type: string
          minLength: 1
      required: [depositCoin, depositNetwork, settleCoin, settleNetwork, depositAmount]
    SideShiftQuote:
      type: object
      properties:
        id:
          type: string
        depositCoin:
          type: string
        depositNetwork:
          type: string
        settleCoin:
          type: string
        settleNetwork:
          type: string
        depositAmount:
          type: string
        settleAmount:
          type: string
        rate:
          type: string
        expiresAt:
          type: string
        depositMin:
          type: string
        depositMax:
          type: string
      required: [id, depositCoin, depositNetwork, settleCoin, settleNetwork, depositAmount, settleAmount, rate, expiresAt]
    SideShiftFixedShiftInput:
      type: object
      properties:
        quoteId:
          type: string
          minLength: 1
        settleAddress:
          type: string
          minLength: 1
        settleMemo:
          type: string
        refundAddress:
          type: string
        refundMemo:
          type: string
      required: [quoteId, settleAddress]
    SideShiftShift:
      type: object
      properties:
        campaignTracked:
          type: boolean
          description: Whether this browser receipt was persisted for campaign entry; only present on creation
        id:
          type: string
        createdAt:
          type: string
        depositCoin:
          type: string
        settleCoin:
          type: string
        depositNetwork:
          type: string
        settleNetwork:
          type: string
        depositAddress:
          type: string
        depositMemo:
          type: ["string", "null"]
        settleAddress:
          type: string
        settleMemo:
          type: ["string", "null"]
        depositMin:
          type: string
        depositMax:
          type: string
        type:
          type: string
        quoteId:
          type: ["string", "null"]
        depositAmount:
          type: ["string", "null"]
        settleAmount:
          type: ["string", "null"]
        expiresAt:
          type: string
        status:
          type: string
        averageShiftSeconds:
          type: ["string", "null"]
        rate:
          type: ["string", "null"]
        depositHash:
          type: ["string", "null"]
        settleHash:
          type: ["string", "null"]
        updatedAt:
          type: ["string", "null"]
        issue:
          type: ["string", "null"]
      required: [id, createdAt, depositCoin, settleCoin, depositNetwork, settleNetwork, depositAddress, settleAddress, depositMin, depositMax, type, expiresAt, status]

