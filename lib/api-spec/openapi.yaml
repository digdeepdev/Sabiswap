openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sideshift
    description: SideShift.ai swap operations
paths:
  /market/prices:
    get:
      operationId: getMarketPrices
      tags: [market]
      summary: Top cryptocurrencies by market capitalization
      responses:
        "200":
          description: USD prices, 24-hour changes and seven-day price history from CoinGecko
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketPrices"
        "502":
          description: Market data temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sideshift/coins:
    get:
      operationId: listSideShiftCoins
      tags: [sideshift]
      summary: List supported SideShift coins
      responses:
        "200":
          description: Supported coins and networks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SideShiftCoin"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /sideshift/quote:
    post:
      operationId: createSideShiftQuote
      tags: [sideshift]
      summary: Create a SideShift quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SideShiftQuoteInput"
      responses:
        "200":
          description: Quote details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SideShiftQuote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /sideshift/shifts/fixed:
    post:
      operationId: createSideShiftFixedShift
      tags: [sideshift]
      summary: Create a fixed-rate SideShift shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SideShiftFixedShiftInput"
      responses:
        "201":
          description: Fixed shift details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SideShiftShift"
        "400":
          $ref: "#/components/responses/BadRequest"
        "502":
          $ref: "#/components/responses/UpstreamError"
  /sideshift/shifts/{shiftId}:
    get:
      operationId: getSideShiftShift
      tags: [sideshift]
      summary: Get SideShift shift status
      parameters:
        - name: shiftId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shift details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SideShiftShift"
        "404":
          description: Shift not found
        "502":
          $ref: "#/components/responses/UpstreamError"
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamError:
      description: SideShift.ai API error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    MarketPrices:
      type: object
      required: [coins, fetchedAt, source, stale]
      properties:
        coins:
          type: array
          items:
            $ref: "#/components/schemas/MarketCoin"
        fetchedAt:
          type: string
        source:
          type: string
        stale:
          type: boolean
    MarketCoin:
      type: object
      required: [id, symbol, name, image, priceUsd, change24h, rank, sparkline, lastUpdated]
      properties:
        id:
          type: string
        symbol:
          type: string
        name:
          type: string
        image:
          type: string
        priceUsd:
          type: number
        change24h:
          type: ["number", "null"]
        rank:
          type: ["number", "null"]
        sparkline:
          type: array
          items:
            type: number
        lastUpdated:
          type: ["string", "null"]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: ["string", "null"]
      required:
        - error
    SideShiftCoin:
      type: object
      properties:
        coin:
          type: string
        name:
          type: string
        networks:
          type: array
          items:
            type: string
        networksWithMemo:
          type: array
          items:
            type: string
        fixedOnly:
          oneOf:
            - type: boolean
            - type: array
              items:
                type: string
        variableOnly:
          oneOf:
            - type: boolean
            - type: array
              items:
                type: string
        tokenDetails:
          type: object
          additionalProperties:
            type: object
            properties:
              contractAddress:
                type: string
              decimals:
                type: number
            required: [contractAddress, decimals]
      required: [coin, name, networks, networksWithMemo, fixedOnly, variableOnly]
    SideShiftQuoteInput:
      type: object
      properties:
        depositCoin:
          type: string
          minLength: 1
        depositNetwork:
          type: string
          minLength: 1
        settleCoin:
          type: string
          minLength: 1
        settleNetwork:
          type: string
          minLength: 1
        depositAmount:
          type: string
          minLength: 1
      required: [depositCoin, depositNetwork, settleCoin, settleNetwork, depositAmount]
    SideShiftQuote:
      type: object
      properties:
        id:
          type: string
        depositCoin:
          type: string
        depositNetwork:
          type: string
        settleCoin:
          type: string
        settleNetwork:
          type: string
        depositAmount:
          type: string
        settleAmount:
          type: string
        rate:
          type: string
        expiresAt:
          type: string
        depositMin:
          type: string
        depositMax:
          type: string
      required: [id, depositCoin, depositNetwork, settleCoin, settleNetwork, depositAmount, settleAmount, rate, expiresAt]
    SideShiftFixedShiftInput:
      type: object
      properties:
        quoteId:
          type: string
          minLength: 1
        settleAddress:
          type: string
          minLength: 1
        settleMemo:
          type: string
        refundAddress:
          type: string
        refundMemo:
          type: string
      required: [quoteId, settleAddress]
    SideShiftShift:
      type: object
      properties:
        id:
          type: string
        createdAt:
          type: string
        depositCoin:
          type: string
        settleCoin:
          type: string
        depositNetwork:
          type: string
        settleNetwork:
          type: string
        depositAddress:
          type: string
        depositMemo:
          type: ["string", "null"]
        settleAddress:
          type: string
        settleMemo:
          type: ["string", "null"]
        depositMin:
          type: string
        depositMax:
          type: string
        type:
          type: string
        quoteId:
          type: ["string", "null"]
        depositAmount:
          type: ["string", "null"]
        settleAmount:
          type: ["string", "null"]
        expiresAt:
          type: string
        status:
          type: string
        averageShiftSeconds:
          type: ["string", "null"]
        rate:
          type: ["string", "null"]
        depositHash:
          type: ["string", "null"]
        settleHash:
          type: ["string", "null"]
        updatedAt:
          type: ["string", "null"]
        issue:
          type: ["string", "null"]
      required: [id, createdAt, depositCoin, settleCoin, depositNetwork, settleNetwork, depositAddress, settleAddress, depositMin, depositMax, type, expiresAt, status]

